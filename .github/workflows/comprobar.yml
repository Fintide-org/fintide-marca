name: comprobar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    # La marca tiene que salir igual en la computadora de cualquiera del
    # equipo. Se prueba en los tres sistemas y en las dos arquitecturas que
    # hay: macOS es ARM, Linux y Windows son x86.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La deriva con el monorepo no corre aquí: leer `Fintide-org/Fintide`
      # desde este flujo necesita un token con acceso a ese repositorio. Se
      # corre en local con --monorepo, y la salida lo dice.
      - run: npm run comprobar -- --probar
